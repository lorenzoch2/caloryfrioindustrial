[build]
  command = "vite build"
  publish = "dist/client"

[dev]
  command = "npm run dev"
  targetPort = 3000
  port = 8888

# Única regla de redirect: /sector-publico existió hasta octubre de 2026 y puede
# estar indexada o enlazada desde afuera. Va a la portada con 301 en vez de
# devolver 404. `force` es necesario porque el handler SSR atiende todas las
# rutas. El resto del enrutamiento lo resuelve ese handler, que ya devuelve 404
# en rutas inexistentes; la regla anterior (`from = "/**"`) nunca se aplicó,
# porque el comodín de Netlify es `/*`.
[[redirects]]
  from = "/sector-publico"
  to = "/"
  status = 301
  force = true

# Estas cabeceras sólo alcanzan a los archivos estáticos del CDN — la respuesta
# HTML la emite la función SSR y no pasa por aquí. La autoridad es
# `netlify/edge-functions/security-headers.ts`, que las fija en TODA respuesta.
# Este bloque se mantiene como piso: si la edge function no llegara a
# desplegarse, los estáticos siguen protegidos.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
